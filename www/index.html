.meals.map((m,i)=>({m,i})).sort((a,b)=>a.m.name.localeCompare(b.m.name,'pl')).map(({m,i})=>`<div class="meal catalog-item" data-search="${esc([m.name,...(m.ingredients||[]).map(x=>x.name)].join(' ').toLocaleLowerCase('pl-PL'))}"><div class="mealemoji">🥣</div><div class="mealtext"><div class="mealname">${esc(m.name)}</div><div class="mealmeta">${(m.ingredients||[]).length} składników · ${m.kcal} kcal / porcja</div></div><button class="secondary" onclick="recipeModal(${i})">Edytuj</button><button class="iconbtn" type="button" aria-label="Usuń danie ${esc(m.name)}" title="Usuń danie" onclick="delRecipe(${i})"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6m5 4v6m4-6v6"/></svg></button></div>`).join(''):`<div class="empty">Zapisz ulubione dania jako zestawy składników.</div>`}<div class="empty catalog-no-results" hidden>Brak dań pasujących do wyszukiwania.</div><div class="catalog-pagination" data-pager="dishes" hidden></div></section></div>`}function filterCatalog(value,resetPages=true){state.catalogQuery=(value||'').toLocaleLowerCase('pl-PL').trim();if(resetPages)state.catalogPages={foods:1,dishes:1};document.querySelectorAll('.catalog-panel').forEach(panel=>{let key=panel.dataset.catalog;panel.querySelectorAll('.catalog-item').forEach(item=>item.dataset.searchMatch=String(!state.catalogQuery||item.dataset.search.includes(state.catalogQuery)));updateCatalogPanel(panel,key,state.catalogPages[key]||1)})}

async function load(){let r=await api('load',{token:localStorage.getItem('kcal_auth')});if(!r?.ok){toast(r?.error==='Sesja wygasła'?'Sesja wygasła. Zaloguj się ponownie.':`Nie udało się pobrać danych${r?.error?`: ${r.error}`:''}.`);console.error('Kcalendar load failed',r);return false}state.data=r.data||{foods:[],meals:[],days:{}};state.data.foods=Array.isArray(state.data.foods)?state.data.foods:[];state.data.meals=Array.isArray(state.data.meals)?state.data.meals:[];state.data.days=state.data.days&&typeof state.data.days==='object'?state.data.days:{};state.user=r.user;let localDay=today(),utcDay=new Date().toISOString().slice(0,10);if(localDay!==utcDay&&!state.data.days[localDay]&&state.data.days[utcDay]){state.data.days[localDay]=state.data.days[utcDay];delete state.data.days[utcDay];let saved=await api('save',{token:localStorage.getItem('kcal_auth'),data:state.data});if(!saved?.ok)console.error('Kcalendar date migration failed',saved)}return true}function saveProblem(message){render();modal('Problem z zapisem',`<p class="confirm-copy">${esc(message)} Twoje dane pozostają widoczne na tym ekranie. Nie odświeżaj go, dopóki problem nie zostanie rozwiązany.</p>`,'OK',x=>x.remove())}let saveQueue=Promise.resolve();async function save(){let snapshot=JSON.parse(JSON.stringify(state.data)),savedDate=state.date;render();saveQueue=saveQueue.then(()=>api('save',{token:localStorage.getItem('kcal_auth'),data:snapshot}));let r=await saveQueue;if(!r?.ok){let message=r?.error==='Sesja wygasła'?'Sesja wygasła. Zaloguj się ponownie, aby zsynchronizować zmiany.':`Serwer odrzucił zapis${r?.error?`: ${r.error}`:''}.`;console.error('Kcalendar save failed',r);saveProblem(message);return false}let check=await api('load',{token:localStorage.getItem('kcal_auth')});if(!check?.ok){let message=`Zapis został wysłany, ale odczyt kontrolny nie powiódł się${check?.error?`: ${check.error}`:''}.`;console.error('Kcalendar save verification failed',check);saveProblem(message);return false}let expected function toggleRecipeSearch(root){let panel=root.querySelector('#recipeAddPanel'),search=root.querySelector('#recipeFoodSearch');panel.hidden=!panel.hidden;if(!panel.hidden)search.focus();else{search.value='';filterRecipeFoods('',root)}}function recipeModal(i=null){if(!state.data.foods.length){toast('Najpierw dodaj produkty');return}let old=i===null?null:state.data.meals[i],draft=(old?.ingredients||[]).map(v=>({foodIndex:state.data.foods.findIndex(f=>f.name===v.name),grams:String(v.g)})).filter(v=>v.foodIndex>=0);let root=modal(old?'Edytuj zestaw':'Nowy zestaw',`<label class="field">Nazwa zestawu<input class="input" id="rname" value="${old?esc(old.name):''}" placeholder="np. Moja owsianka"></label><div class="subtle">Wybierz składniki dania. Użyj wyszukiwarki, aby dodać produkty z Twojej listy.</div><div class="recipe-add-wrap"><button class="secondary recipe-add-toggle" type="button" onclick="toggleRecipeSearch(this.closest('.modal-back'))"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Dodaj produkt</button><div class="recipe-add-panel" id="recipeAddPanel" hidden><label class="field">Szukaj produktu<input class="input" type="search" id="recipeFoodSearch" placeholder="Szukaj w moich produktach…" oninput="filterRecipeFoods(this.value,this.closest('.modal-back'))"></label><div class="subtle recipe-search-help" id="recipeSearchHelp">Wpisz nazwę produktu, aby znaleźć go i dodać do dania.</div><div id="recipeFoodResults" class="recipe-search-results" hidden></div></div></div><div class="recipe-part-title">Składniki dania <span id="recipeIngredientCount"></span></div><div id="recipeIngredientsList" class="recipe-selected-list"></div>`,old?'Zapisz':'Dodaj danie',x=>{let ingredients=[],kcal=0;(x._recipeDraft||[]).forEach(item=>{let f=state.data.foods[item.foodIndex],g=+item.grams;if(f&&g>0){ingredients.push({name:f.name,g});kcal+=Math.round(f.kcal*g/100)}});let name=x.querySelector('#rname').value.trim();if(!name||!ingredients.length)return
