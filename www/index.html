function calendar(){let tabs=['week','month','year'];let labels={week:'Tydzień',month:'Miesiąc',year:'Rok'},ds=datesForRange(),label=state.range==='year'?new Date(state.date).getFullYear():state.range==='month'?new Date(state.date+'T12:00:00').toLocaleDateString('pl-PL',{month:'long',year:'numeric'}):`${new Date(ds[0]+'T12:00:00').toLocaleDateString('pl-PL',{day:'numeric',month:'short'})} – ${new Date(state.date+'T12:00:00').toLocaleDateString('pl-PL',{day:'numeric',month:'short'})}`;let chartValues=ds.map(periodMetrics),scale=state.range==='year'?31:1,maxC=Math.max(state.data.goals.calories*scale,...chartValues.map(x=>x.calories)),maxS=Math.max(state.data.goals.steps*scale,...chartValues.map(x=>x.steps)),maxF=Math.max(state.data.goals.fluids*scale,...chartValues.map(x=>x.fluids)),allDs=state.range==='year'?Array.from({length:(Date.UTC(new Date(state.date+'T12:00:00').getFullYear()+1,0,1)-Date.UTC(new Date(state.date+'T12:00:00').getFullYear(),0,1))/86400000},(_,i)=>new Date(new Date(state.date+'T12:00:00').getFullYear(),0,i+1,12).toISOString().slice(0,10)):ds,activeDs=allDs.filter(d=>{let v=dateMetrics(d);return v.meals>0||v.activities>0});return `${head('Kalendarz',`<div class="date-nav"><button class="iconbtn" onclick="shiftRange(-1)">‹</button><span class="date-display">${label}</span><button class="iconbtn" onclick="shiftRange(1)">›</button></div>`)}<div class="viewtabs" style="margin-bottom:16px">${tabs.map(t=>`<button class="viewtab ${state.range===t?'active':''}" onclick="setRange('${t}')">${labels[t]}</button>`).join('')}</div><div class="export-toolbar"><button class="secondary" type="button" onclick="exportModal()">↓ Eksport do Excela</button></div><section class="card chart-card"><div class="section-head"><div><h2 class="section-title">Kalorie, kroki i płyny</h2><div class="subtle" style="margin-top:5px">Twoje postępy w wybranym okresie</div></div><div class="legend"><span><i class="dot"></i>Kalorie</span><span><i class="dot green"></i>Kroki</span><span> function buildBackupData(raw){let data=JSON.parse(JSON.stringify(raw||{}));for(let key of ['password','passwordHash','verifier','salt','token','session'])delete data[key];data.foods=Array.isArray(data.foods)?data.foods:[];data.meals=Array.isArray(data.meals)?data.meals:[];data.activityTypes=Array.isArray(data.activityTypes)?data.activityTypes:[];data.days=data.days&&typeof data.days==='object'&&!Array.isArray(data.days)?data.days:{};data.goals={calories:2000,steps:8000,fluids:2000,...(data.goals||{})};return data}async function exportJson(){await saveQueue;let response=await api('load',{token:localStorage.getItem('kcal_auth')});if(!response?.ok)return toast(response?.error||'Nie udało się pobrać danych');let data=buildBackupData(response.data),days=Object.values(data.days),backup={format:'kcalendar-backup',version:1,exportedAt:new Date().toISOString(),contents:{products:data.foods.length,dishes:data.meals.length,activityTypes:data.activityTypes.length,days:days.length,foodAndDrinkEntries:days.reduce((sum,day)=>sum+(day.meals?.length||0),0),activityEntries:days.reduce((sum,day)=>sum+(day.activities?.length||0),0)},data},blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`kcalendar-pelna-kopia_${new Date().toISOString().slice(0,10)}.json`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}function validBackupData(data){if(!data||typeof data!=='object'||Array.isArray(data)||!Array.isArray(data.foods)||!Array.isArray(data.meals)||!data.days||typeof data.days!=='object'||Array.isArray(data.days))return false;if(data.activityTypes!==undefined&&!Array.isArray(data.activityTypes))return false;if(data.goals!==undefined&&(!data.goals||typeof data.goals!=='object'||Array.isArray(data.goals)))return false;return Object.values(data.days).every(day=>day&&typeof day==='object'&&Array.isArray(day.meals)&&Array.isArray(day.activities))}async function previewJsonImport(input){let file=input.files?.[0];input.value='';if(!file)return;if(file.size>20*1024*1024)return toast('Plik JSON jest zbyt duży (maksymalnie 20 MB)');let backup;try{backup=JSON.parse(await file.text())}catch{return toast('Nie udało się odczytać pliku JSON')}if(backup?.format!=='kcalendar-backup'||backup.version!==1||!validBackupData(backup.data))return toast('To nie jest poprawna kopia danych kcalendar');let data=backup.data;for(let key of ['password','passwordHash','verifier','salt','token','session'])delete data[key];let dayCount=Object.keys(data.days).length,mealCount=Object.values(data.days).reduce((sum,day)=>sum+day.meals.length,0),activityCount=Object.values(data.days).reduce((sum,day)=>sum+day.activities.length,0);confirmAction('Zastąpić dane konta?',`Wczytasz kopię: ${data.foods.length} produktów, ${data.meals.length} dań, ${(data.activityTypes||[]).length} rodzajów aktywności, ${dayCount} dni, ${mealCount} wpisów jedzenia i napojów oraz ${activityCount} wpisów aktywności.<br><br>Obecne dane konta „${esc(state.user)}” zostaną zastąpione. Hasło i konto pozostaną bez zmian.`,'Importuj',async root=>{let button=root.querySelector('#modalok');button.disabled=true;await saveQueue;let result=await api('save',{token:localStorage.getItem('kcal_auth'),revision:state.revision,data});if(!result?.ok){button.disabled=false;return toast(result?.error||'Nie udało się wczytać danych')}if(!await load()){button.disabled=false;return toast('Dane zapisano, ale nie udało się ich ponownie pobrać')}root.remove();render();toast('Dane zostały zaimportowane')})}

function applyAccount(document){state.uuid=document.uuid;state.revision=document.revision;state.updatedAt=document.updatedAt||'';state.data=document.data||{foods:[],meals:[],days:{}};state.data.foods=Array.isArray(state.data.foods)?state.data.foods:[];state.data.meals=Array.isArray(state.data.meals)?state.data.meals:[];state.data.activityTypes=Array.isArray(state.data.activityTypes)?state.data.activityTypes:[];state.data.goals={calories:2000,steps:8000,fluids:2000,...(state.data.goals||{})};state.data.days=state.data.days&&typeof state.data.days==='object'&&!Array.isArray(state.data.days)?state.data.days:{};state.user=document.user||state.user;localStorage.setItem('kcal_user_uuid',state.uuid)}async function load(){let token=localStorage.getItem('kcal_auth'),status=await api('status',{token});if(!status?.ok){if(status?.error==='Brak połączenia z serwerem'){let uuid=localStorage.getItem('kcal_user_uuid'),cached=uuid?await cacheGet(uuid):null;if(cached){applyAccount(cached);toast('Pokazuję ostatnią zapisaną kopię danych. Brak połączenia z serwerem.');return true}}toast(status?.error||'Nie udało się sprawdzić danych');return false}let cached=await cacheGet(status.uuid);if(cached?.revision===status.revision&&cached?.data){applyAccount({...cached,user:status.user});return true}let fresh=await api('load',{token});if(!fresh?.ok){toast(fresh?.error||'Nie udało się pobrać danych');return false}applyAccount(fresh);await cachePut({uuid:fresh.uuid,revision:fresh.revision,updatedAt:fresh.updatedAt,user:fresh.user,data:fresh.data});return true}function saveProblem(message){render();modal('Problem z zapisem',`<p class="confirm-copy">${esc(message)} Twoje dane pozostają widoczne na tym ekranie. Nie odświeżaj go, dopóki problem nie zostanie rozwiązany.</p>`,'OK',x=>x.remove())}let saveQueue=Promise.resolve(),writeEpoch=0;function queueWrite(action,payload){let epoch=writeEpoch;saveQueue=saveQueue.then(async()=>{if(epoch!==writeEpoch)return false;let result=await api(action,{token:loc function toggleRecipeSearch(root){let panel=root.querySelector('#recipeAddPanel'),search=root.querySelector('#recipeFoodSearch');panel.hidden=!panel.hidden;if(!panel.hidden)search.focus();else{search.value='';filterRecipeFoods('',root)}}function recipeModal(i=null){if(!state.data.foods.length){toast('Najpierw dodaj produkty');return}let old=i===null?null:state.data.meals[i],draft=(old?.ingredients||[]).map(v=>({foodIndex:state.data.foods.findIndex(f=>f.name===v.name),grams:String(v.g)})).filter(v=>v.foodIndex>=0);let root=modal(old?'Edytuj zestaw':'Nowy zestaw',`<label class="field">Nazwa zestawu<input class="input" id="rname" value="${old?esc(old.name):''}" placeholder="np. Moja owsianka"></label><div class="subtle">Wybierz składniki dania. Użyj wyszukiwarki, aby dodać produkty z Twojej listy.</div><div class="recipe-add-wrap"><button class="secondary recipe-add-toggle" type="button" onclick="toggleRecipeSearch(this.closest('.modal-back'))"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Dodaj produkt</button><div class="recipe-add-panel" id="recipeAddPanel" hidden><label class="field">Szukaj produktu<input class="input" type="search" id="recipeFoodSearch" placeholder="Szukaj w moich produktach…" oninput="filterRecipeFoods(this.value,this.closest('.modal-back'))"></label><div class="subtle recipe-search-help" id="recipeSearchHelp">Wpisz nazwę produktu, aby znaleźć go i dodać do dania.</div><div id="recipeFoodResults" class="recipe-search-results" hidden></div></div></div><div class="recipe-part-title">Składniki dania <span id="recipeIngredientCount"></span></div><div id="recipeIngredientsList" class="recipe-selected-list"></div>`,old?'Zapisz':'Dodaj danie',x=>{let ingredients=[],kcal=0;(x._recipeDraft||[]).forEach(item=>{let f=state.data.foods[item.foodIndex],g=+item.grams;if(f&&g>0){ingredients.push({name:f.name,g});kcal+=Math.round(f.kcal*g/100)}});let name=x.querySelector('#rname').value.trim();if(!name||!ingredients.length)return
